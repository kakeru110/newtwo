name: ニュース収集・分析パイプライン

# CLAUDE.md 2章: 1日2回(朝7時・夜19時 JST目安)。
# UTC換算: 07:00 JST = 22:00 UTC(前日) / 19:00 JST = 10:00 UTC
on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 収集・クラスタリング・分析パイプラインを実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run pipeline

      - name: 生成されたデータをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          if git diff --staged --quiet; then
            echo "変更なし(新しいトピックが見つかりませんでした)"
          else
            DATE=$(date -u -d '+9 hours' +%Y-%m-%d)
            git commit -m "chore: ${DATE}分のニュースデータを自動生成"
            git push
          fi
